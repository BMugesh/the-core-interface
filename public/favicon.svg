<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgb(20,20,30);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(0,0,0);stop-opacity:1" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9d00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="128" fill="url(#grad1)" stroke="#333" stroke-width="8" />
  
  <!-- Optional inner futuristic line -->
  <circle cx="256" cy="256" r="220" stroke="url(#textGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="20 40" />

  <!-- Initials -->
  <text x="50%" y="54%" font-family="'Inter', sans-serif" font-weight="900" font-size="280" text-anchor="middle" dominant-baseline="central" fill="url(#textGrad)" filter="url(#glow)" style="letter-spacing: -15px;">
    BM
  </text>
</svg>
